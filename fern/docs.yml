# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: binflow.docs.buildwithfern.com
    custom-domain: docs.binflow.org
title: BinFlow | Documentation / 文档
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: 文档 / Docs
    icon: home
  API Reference:
    display-name: API 状态 / Status
    icon: puzzle
navigation:
  - tab: home
    layout:
      - section: 项目 / Project
        contents:
          - page: BinFlow
            path: docs/pages/welcome.mdx
          - page: 已确认需求 / Requirements
            path: docs/pages/project/requirements.mdx
          - page: 项目状态 / Status
            path: docs/pages/project/status.mdx
          - page: 阅读导航 / Reading guide
            path: docs/pages/navigation.mdx
          - page: 支持 / Support
            path: docs/pages/support.mdx
      - section: 研发 / Engineering
        contents:
          - page: P0 计划 / Foundation
            path: docs/pages/engineering/p0-plan.mdx
          - page: 架构决定 / Architecture
            path: docs/pages/engineering/architecture.mdx
          - page: 启动提案 / Startup proposal
            path: docs/pages/engineering/startup-proposal.mdx
          - page: 研发规范 / Conventions
            path: docs/pages/writing-content.mdx
          - page: 接续研发 / Continuation
            path: docs/pages/engineering/continuation.mdx
          - page: 文档贡献 / Documentation
            path: docs/pages/editing-your-docs.mdx
      - section: 兼容研究 / Compatibility research
        contents:
          - page: 能力矩阵 v1 / Matrix
            path: docs/pages/research/capability-matrix.mdx
          - page: 研究索引 / Provenance
            path: docs/pages/research/index.mdx
  - tab: API Reference
    layout:
      - page: API 状态 / API status
        path: docs/pages/api-reference-overview.mdx
redirects:
  - source: /customization
    destination: /editing-your-docs
  - source: /docs/changelog/changelog
    destination: /project/status
  - source: /docs/changelog/changelog/:entry*
    destination: /project/status
  - source: /changelog
    destination: /project/status
  - source: /changelog/:entry*
    destination: /project/status
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#008700"
    dark: "#4ADE80"
  background:
    light: "#FFFFFF"
    dark: "#111113"
  border:
    light: "#E5E7EB"
    dark: "#222325"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-light.svg
  light: docs/assets/logo-light.svg
  height: 20
  href: https://docs.binflow.org
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
