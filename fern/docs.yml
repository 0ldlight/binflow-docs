# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: binflow.docs.buildwithfern.com
    custom-domain: docs.binflow.org
title: BinFlow | Documentation / 文档
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: 使用文档 / User guide
    icon: home
navigation:
  - tab: home
    layout:
      - page: BinFlow
        path: docs/pages/welcome.mdx
      - page: 配置下载服务 / Configure downloads
        path: docs/pages/configure-downloads.mdx
      - page: API 参考 / API reference
        path: docs/pages/api-reference-overview.mdx
      - page: 发布说明 / Release notes
        path: docs/pages/releases.mdx
      - page: 问题反馈 / Support
        path: docs/pages/support.mdx
redirects:
  - source: /customization
    destination: https://github.com/0ldlight/bf/blob/37cc1120090aad6e5002fd221784d835379d9de2/docs/DOCUMENTATION.md
  - source: /editing-your-docs
    destination: https://github.com/0ldlight/bf/blob/37cc1120090aad6e5002fd221784d835379d9de2/docs/DOCUMENTATION.md
  - source: /writing-content
    destination: https://github.com/0ldlight/bf/blob/37cc1120090aad6e5002fd221784d835379d9de2/docs/ENGINEERING-CONVENTIONS.md
  - source: /navigation
    destination: https://github.com/0ldlight/bf/blob/37cc1120090aad6e5002fd221784d835379d9de2/README.md
  - source: /project/status
    destination: /releases
  - source: /docs/changelog/changelog
    destination: /releases
  - source: /docs/changelog/changelog/:entry*
    destination: /releases
  - source: /changelog
    destination: /releases
  - source: /changelog/:entry*
    destination: /releases
colors:
  accent-primary:
    light: "#008700"
    dark: "#4ADE80"
  background:
    light: "#FFFFFF"
    dark: "#111113"
  border:
    light: "#E5E7EB"
    dark: "#222325"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-light.svg
  light: docs/assets/logo-light.svg
  height: 20
  href: https://docs.binflow.org
favicon: docs/assets/favicon.svg
css:
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
